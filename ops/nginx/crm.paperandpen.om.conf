# The former CRM is permanently retired and its successor is Paper & Pen ERP.
# A 503 response is temporary by definition and must not describe this state.
server {
    listen 80;
    server_name crm.paperandpen.om;
    return 301 https://erp.paperandpen.om/;
}

server {
    listen 443 ssl http2;
    server_name crm.paperandpen.om;

    ssl_certificate /www/server/panel/vhost/cert/paperandpen.om/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/paperandpen.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    return 301 https://erp.paperandpen.om/;
}
