# HTTP to HTTPS
server {
    listen 80;
    server_name paperandpen.om www.paperandpen.om;
    return 301 https://$host$request_uri;
}

# Canonical www host to apex
server {
    listen 443 ssl;
    server_name www.paperandpen.om;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    ssl_certificate /www/server/panel/vhost/cert/paperandpen.om/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/paperandpen.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://paperandpen.om$request_uri;
}

server {
    listen 443 ssl;
    server_name paperandpen.om;
    add_header Link "</llms.txt>; rel=\"service-doc\", </sitemap-index.xml>; rel=\"sitemap\", </.well-known/api-catalog>; rel=\"api-catalog\", </.well-known/agent-skills/index.json>; rel=\"describedby\"" always;
    location = /.well-known/api-catalog { default_type application/linkset+json; }
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    error_page 404 /404.html;

    root /www/wwwroot/paperandpen.om;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/paperandpen.om/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/paperandpen.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # The former shop hub now has a truthful stationery successor. Individual
    # retired catalogue, product, category and account routes remain gone.
    location = /shop               { return 301 https://paperandpen.om/stationery-supplies-oman/; }
    location = /shop/              { return 301 https://paperandpen.om/stationery-supplies-oman/; }
    location ^~ /product/          { return 410; }
    location ^~ /product-category/ { return 410; }
    location ^~ /product-tag/      { return 410; }
    location ^~ /category/         { return 410; }
    location ^~ /shop              { return 410; }
    location = /wishlist           { return 410; }
    location = /wishlist/          { return 410; }
    location = /shop-cart          { return 410; }
    location = /shop-cart/         { return 410; }
    location ^~ /hello-world       { return 410; }
    location = /contact-v1         { return 410; }
    location = /privacy-policy-2   { return 410; }

    location / {
        try_files $uri $uri/ @short;
    }

    # Link shortener shared service on 127.0.0.1:8790. The base is selected per
    # request so each tenant keeps its own public domain.
    location ^~ /_s/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unknown short codes render this site's branded 404 page.
    location @short {
        proxy_pass http://127.0.0.1:8790;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.ht {
        deny all;
    }

    access_log /www/wwwlogs/paperandpen.om.log;
    error_log /www/wwwlogs/paperandpen.om.error.log;
}
